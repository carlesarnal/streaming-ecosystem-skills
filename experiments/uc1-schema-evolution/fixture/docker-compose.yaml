# Minimal UC1 fixture: Kafka (KRaft) + Apicurio Registry (in-memory SQL).
# Usage: docker compose -f experiments/uc1-schema-evolution/fixture/docker-compose.yaml up -d
services:
  kafka:
    image: quay.io/strimzi/kafka:latest-kafka-4.2.0
    command:
      - /bin/sh
      - -c
      - |
        export CLUSTER_ID=$$(bin/kafka-storage.sh random-uuid) &&
        bin/kafka-storage.sh format -t $$CLUSTER_ID -c config/kraft/server.properties &&
        bin/kafka-server-start.sh config/kraft/server.properties \
          --override listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT \
          --override listeners=PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093 \
          --override advertised.listeners=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092 \
          --override controller.quorum.voters=1@kafka:9093 \
          --override controller.listener.names=CONTROLLER \
          --override inter.broker.listener.name=PLAINTEXT \
          --override node.id=1 \
          --override process.roles=broker,controller \
          --override offsets.topic.replication.factor=1 \
          --override transaction.state.log.replication.factor=1 \
          --override transaction.state.log.min.isr=1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  apicurio-registry:
    image: quay.io/apicurio/apicurio-registry:latest-snapshot
    ports:
      - "8081:8080"
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: h2
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
