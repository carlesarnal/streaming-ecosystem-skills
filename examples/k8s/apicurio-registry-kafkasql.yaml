---
# Plain (no auth) — connect to Strimzi plain listener
apiVersion: registry.apicur.io/v1
kind: ApicurioRegistry3
metadata:
  name: my-registry
spec:
  app:
    storage:
      type: kafkasql
      kafkasql:
        bootstrapServers: my-cluster-kafka-bootstrap:9092
    ingress:
      host: my-registry-app.apps.cluster.example
  ui:
    ingress:
      host: my-registry-ui.apps.cluster.example

