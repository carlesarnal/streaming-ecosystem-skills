---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: mysql-connector
  labels:
    strimzi.io/cluster: my-connect-cluster
spec:
  class: io.debezium.connector.mysql.MySqlConnector
  tasksMax: 1
  config:
    database.hostname: mysql
    database.port: "3306"
    database.user: debezium
    database.password: dbz
    database.server.id: "184054"
    topic.prefix: dbserver1
    database.include.list: sourcedb
    schema.history.internal.kafka.bootstrap.servers: my-cluster-kafka-bootstrap:9092
    schema.history.internal.kafka.topic: schema-changes.sourcedb
    # Apicurio Avro converters
    key.converter: io.apicurio.registry.utils.converter.AvroConverter
    key.converter.apicurio.registry.url: http://my-registry-app:8080/apis/registry/v3
    key.converter.apicurio.registry.auto-register: "true"
    value.converter: io.apicurio.registry.utils.converter.AvroConverter
    value.converter.apicurio.registry.url: http://my-registry-app:8080/apis/registry/v3
    value.converter.apicurio.registry.auto-register: "true"
