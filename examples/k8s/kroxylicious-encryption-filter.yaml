---
# Record Encryption filter using HashiCorp Vault KMS
# Encrypts record values with envelope encryption (DEK encrypted by KEK in Vault)
apiVersion: kroxylicious.io/v1alpha1
kind: KafkaProtocolFilter
metadata:
  name: my-encryption-filter
spec:
  type: RecordEncryption
  configTemplate:
    kms: VaultKmsService
    kmsConfig:
      vaultTransitEngineUrl: https://vault.example.com:8200/v1/transit
      tls: {}
      vaultToken:
        passwordFile: /opt/vault/token
    selector: TemplateKekSelector
    selectorConfig:
      template: "KEK_$(topicName)"
---
