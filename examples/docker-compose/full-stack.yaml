services:
  kafka:
    image: quay.io/strimzi/kafka:latest-kafka-4.2.0
    command:
      - /bin/sh
      - -c
      - |
        export CLUSTER_ID=$$(bin/kafka-storage.sh random-uuid) &&
        bin/kafka-storage.sh format -t $$CLUSTER_ID -c config/kraft/server.properties &&
        bin/kafka-server-start.sh config/kraft/server.properties \
          --override listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT \
          --override listeners=PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093 \
          --override advertised.listeners=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092 \
          --override controller.quorum.voters=1@kafka:9093 \
          --override controller.listener.names=CONTROLLER \
          --override inter.broker.listener.name=PLAINTEXT \
          --override node.id=1 \
          --override process.roles=broker,controller \
          --override offsets.topic.replication.factor=1 \
          --override transaction.state.log.replication.factor=1 \
          --override transaction.state.log.min.isr=1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: quay.io/debezium/postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sourcedb
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=5
      - -c
      - max_replication_slots=5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  apicurio-registry:
    image: quay.io/apicurio/apicurio-registry:latest-snapshot
    ports:
      - "8080:8080"
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: h2
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  apicurio-registry-ui:
    image: quay.io/apicurio/apicurio-registry-ui:latest-snapshot
    ports:
      - "8888:8080"
    environment:
      REGISTRY_API_URL: http://localhost:8080/apis/registry/v3
    depends_on:
      apicurio-registry:
        condition: service_healthy

  kroxylicious:
    image: quay.io/kroxylicious/kroxylicious:latest
    ports:
      - "19092:19092"
      - "19093:19093"
    volumes:
      - ./kroxylicious-config.yaml:/opt/kroxylicious/config.yaml:ro
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9190/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  debezium-connect:
    image: quay.io/debezium/connect:3.0
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      ENABLE_APICURIO_CONVERTERS: "true"
      KEY_CONVERTER: io.apicurio.registry.utils.converter.AvroConverter
      VALUE_CONVERTER: io.apicurio.registry.utils.converter.AvroConverter
      CONNECT_KEY_CONVERTER_APICURIO_REGISTRY_URL: http://apicurio-registry:8080/apis/registry/v3
      CONNECT_KEY_CONVERTER_APICURIO_REGISTRY_AUTO_REGISTER: "true"
      CONNECT_VALUE_CONVERTER_APICURIO_REGISTRY_URL: http://apicurio-registry:8080/apis/registry/v3
      CONNECT_VALUE_CONVERTER_APICURIO_REGISTRY_AUTO_REGISTER: "true"
    depends_on:
      kafka:
        condition: service_healthy
      apicurio-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
